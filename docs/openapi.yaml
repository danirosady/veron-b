components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from `/auth/login`

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1

    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    CompanyId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Authentication required or token invalid/expired
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Authentication required

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Insufficient permissions

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Resource not found

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation failed
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string

  schemas:
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (valid for 15 minutes)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: JWT refresh token (valid for 7 days)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          description: Access token expiry in seconds
          example: 900
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        role:
          type: string
          enum: [superadmin, admin_company]
        company_id:
          type: integer
          nullable: true
        company:
          $ref: "#/components/schemas/Company"
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: PT Mining Indonesia
        code:
          type: string
          example: MNI
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        company:
          $ref: "#/components/schemas/Company"
        name:
          type: string
          example: Site Alpha
        code:
          type: string
          example: ALPHA
        location:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    Unit:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        project:
          $ref: "#/components/schemas/Project"
        plate_number:
          type: string
          example: "B 1234 XYZ"
        code:
          type: string
          example: "DT-001"
        unit_type:
          type: string
          enum: [dump_truck, excavator, loader, bulldozer, dozer, grader, other]
        brand:
          type: string
        model:
          type: string
        manufacture_year:
          type: integer
        status:
          type: string
          enum: [active, inactive]
        mounted_tyres:
          type: array
          description: Tyres currently mounted on this unit
          items:
            $ref: "#/components/schemas/Tyre"
        created_at:
          type: string
          format: date-time

    Driver:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        company:
          $ref: "#/components/schemas/Company"
        name:
          type: string
          example: Budi Santoso
        employee_id:
          type: string
        phone:
          type: string
        license_number:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    Tyre:
      type: object
      properties:
        id:
          type: integer
        serial_number:
          type: string
          example: "SN-2024-00001"
        barcode:
          type: string
        brand_id:
          type: integer
        brand:
          $ref: "#/components/schemas/MasterBrand"
        size_id:
          type: integer
        size:
          $ref: "#/components/schemas/MasterSize"
        type_id:
          type: integer
        type:
          $ref: "#/components/schemas/MasterType"
        pattern_id:
          type: integer
        pattern:
          $ref: "#/components/schemas/MasterPattern"
        depth_new:
          type: number
          format: float
          description: Original tread depth (mm)
        rtd:
          type: number
          format: float
          description: Current remaining tread depth (mm)
        status:
          type: string
          enum: [spare, mounted, scrap]
        unit_id:
          type: integer
          nullable: true
        unit:
          $ref: "#/components/schemas/Unit"
        mounted_position:
          type: string
          nullable: true
          description: Position on unit (e.g. "FL", "FR")
        mounted_date:
          type: string
          format: date
          nullable: true
        mounted_hm:
          type: number
          format: float
          nullable: true
          description: Hour meter at mount time
        cost:
          type: number
          format: float
        purchase_date:
          type: string
          format: date
        supplier:
          type: string
        remarks:
          type: string
        created_at:
          type: string
          format: date-time

    Replacement:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        company:
          $ref: "#/components/schemas/Company"
        project_id:
          type: integer
        project:
          $ref: "#/components/schemas/Project"
        unit_id:
          type: integer
        unit:
          $ref: "#/components/schemas/Unit"
        driver_id:
          type: integer
        driver:
          $ref: "#/components/schemas/Driver"
        date:
          type: string
          format: date
        hm_update:
          type: number
          format: float
        current_life_hm:
          type: number
          format: float
        hm_plan:
          type: number
          format: float
        remarks:
          type: string
        created_by:
          type: integer
        creator:
          $ref: "#/components/schemas/User"
        details:
          type: array
          items:
            $ref: "#/components/schemas/ReplacementDetail"
        created_at:
          type: string
          format: date-time

    ReplacementDetail:
      type: object
      properties:
        position:
          type: integer
          description: Position number on unit
        action:
          type: string
          enum: [mount, dismount, swap]
        old_tyre_id:
          type: integer
          nullable: true
        old_tyre:
          $ref: "#/components/schemas/Tyre"
        new_tyre_id:
          type: integer
          nullable: true
        new_tyre:
          $ref: "#/components/schemas/Tyre"
        failure_reason_id:
          type: integer
          nullable: true
        failure_reason:
          $ref: "#/components/schemas/MasterReason"
        old_tyre_tread_1:
          type: number
          format: float
          nullable: true
        old_tyre_tread_2:
          type: number
          format: float
          nullable: true
        new_tyre_tread_1:
          type: number
          format: float
          nullable: true
        new_tyre_tread_2:
          type: number
          format: float
          nullable: true
        new_tyre_status:
          type: string
          enum: [spare, scrap]
          nullable: true
          description: Target status when dismounting
        remark:
          type: string

    MasterBrand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Bridgestone
        code:
          type: string
          example: BRS
        description:
          type: string
        status:
          type: string
          enum: [active, inactive]

    MasterSize:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "18.00-33"
        code:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive]

    MasterType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Radial
        code:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive]

    MasterPattern:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: E-3
        code:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive]

    MasterReason:
      type: object
      properties:
