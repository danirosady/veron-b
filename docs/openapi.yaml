openapi: 3.0.3
info:
  title: Tyre Management System API
  description: |
    REST API for managing vehicle tyre lifecycle — storage, mounting, dismounting, and disposal
    for heavy equipment in mining and construction operations.

    ## Authentication
    All protected endpoints require a Bearer token obtained via `/api/v1/auth/login`.
    Pass the `access_token` as `Authorization: Bearer <token>`.

    ## Rate Limiting
    Standard rate limits apply. Authenticated users: 1000 requests/minute.

    ## Error Format
    All errors follow a consistent format:
    ```json
    {
      "success": false,
      "message": "Human-readable error message",
      "errors": []
    }
    ```
  version: 1.0.0
  contact:
    name: TMS Support
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.tms.example.com/api/v1
    description: Production server

tags:
  - name: Auth
    description: Authentication and token management
  - name: Companies
    description: Company management (Superadmin only)
  - name: Projects
    description: Project management within companies
  - name: Units
    description: Vehicle/unit management
  - name: Drivers
    description: Driver management
  - name: Tyres
    description: Tyre master data and lifecycle management
  - name: Replacements
    description: Tyre mount, dismount, and swap operations
  - name: Master Data
    description: Reference data (brands, sizes, patterns, etc.)
  - name: Reports
    description: Reports and data export

paths:
  # ─── Auth ───────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticate user and receive access + refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: superadmin@tms.local
                password:
                  type: string
                  format: password
                  example: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      description: Exchange a valid refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid or expired refresh token
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/profile:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [Auth]
      summary: Update current user profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"

  /auth/password:
    put:
      tags: [Auth]
      summary: Change password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Password changed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Companies ───────────────────────────────────────────────────────
  /companies:
    get:
      tags: [Companies]
      summary: List companies
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or code
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Companies]
      summary: Create company
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 200
                  example: PT Mining Indonesia
                code:
                  type: string
                  pattern: "^[A-Z0-9]{2,10}$"
                  example: MNI
                address:
                  type: string
                  example: Jl. Mining No. 1, Jakarta
                phone:
                  type: string
                email:
                  type: string
                  format: email
                status:
                  type: string
                  enum: [active, inactive]
                  default: active
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /companies/{id}:
    get:
      tags: [Companies]
      summary: Get company by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Company"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Companies]
      summary: Update company
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        "200":
          description: Company updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Companies]
      summary: Delete company
      description: Soft delete (sets status to inactive)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Projects ───────────────────────────────────────────────────────
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: company_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

    post:
      tags: [Projects]
      summary: Create project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, name, code]
              properties:
                company_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Site Alpha
                code:
                  type: string
                  example: ALPHA
                location:
                  type: string
                  example: East Kalimantan
                status:
                  type: string
                  enum: [active, inactive]
                  default: active
      responses:
        "201":
          description: Project created
        "400":
          $ref: "#/components/responses/ValidationError"

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get project by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Projects]
      summary: Update project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                location:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        "200":
          description: Project updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Projects]
      summary: Delete project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Units ──────────────────────────────────────────────────────────
  /units:
    get:
      tags: [Units]
      summary: List units
      description: List all units (vehicles/equipment). Company admins see only their company's units.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: project_id
          in: query
          schema:
            type: integer
        - name: company_id
          in: query
          schema:
            type: integer
        - name: unit_type
          in: query
          schema:
            type: string
            enum: [dump_truck, excavator, loader, bulldozer, dozer, grader, other]
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Unit"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

    post:
      tags: [Units]
      summary: Create unit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, plate_number, unit_type]
              properties:
                project_id:
                  type: integer
                plate_number:
                  type: string
                  example: "B 1234 XYZ"
                code:
                  type: string
                  example: "DT-001"
                unit_type:
                  type: string
                  enum: [dump_truck, excavator, loader, bulldozer, dozer, grader, other]
                brand:
                  type: string
                  example: "Caterpillar"
                model:
                  type: string
                  example: "HD785-7"
                manufacture_year:
                  type: integer
                  example: 2020
                status:
                  type: string
                  enum: [active, inactive]
                  default: active
      responses:
        "201":
          description: Unit created
        "400":
          $ref: "#/components/responses/ValidationError"

  /units/{id}:
    get:
      tags: [Units]
      summary: Get unit by ID
      description: Returns unit details including mounted tyres
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unit details with mounted tyres
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Unit"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Units]
      summary: Update unit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plate_number:
                  type: string
                code:
                  type: string
                unit_type:
                  type: string
                brand:
                  type: string
                model:
                  type: string
                manufacture_year:
                  type: integer
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        "200":
          description: Unit updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Units]
      summary: Delete unit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unit deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Drivers ────────────────────────────────────────────────────────
  /drivers:
    get:
      tags: [Drivers]
      summary: List drivers
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: company_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: List of drivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Driver"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

    post:
      tags: [Drivers]
      summary: Create driver
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, name]
              properties:
                company_id:
                  type: integer
                name:
                  type: string
                  example: Budi Santoso
                employee_id:
                  type: string
                  example: "DRV-001"
                phone:
                  type: string
                license_number:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
                  default: active
      responses:
        "201":
          description: Driver created
        "400":
          $ref: "#/components/responses/ValidationError"

  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: Get driver by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver details
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Drivers]
      summary: Update driver
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                employee_id:
                  type: string
                phone:
                  type: string
                license_number:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        "200":
          description: Driver updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Drivers]
      summary: Delete driver
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Tyres ──────────────────────────────────────────────────────────
  /tyres:
    get:
      tags: [Tyres]
      summary: List tyres
      description: List all tyres with optional filters. Can filter by status (spare, mounted, scrap), brand, size, or unit.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          schema:
            type: string
            enum: [spare, mounted, scrap]
        - name: company_id
          in: query
          schema:
            type: integer
        - name: brand_id
          in: query
          schema:
            type: integer
        - name: size_id
          in: query
          schema:
            type: integer
        - name: unit_id
          in: query
          schema:
            type: integer
          description: Filter by currently mounted unit
        - name: search
          in: query
          description: Search by barcode or serial number
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            default: serial_number
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: List of tyres
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tyre"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

    post:
      tags: [Tyres]
      summary: Create tyre
      description: Register a new tyre in the system. New tyres start with status "spare".
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serial_number, brand_id, size_id, type_id, pattern_id, depth_new]
              properties:
                serial_number:
                  type: string
                  example: "SN-2024-00001"
                barcode:
                  type: string
                brand_id:
                  type: integer
                size_id:
                  type: integer
                type_id:
                  type: integer
                pattern_id:
                  type: integer
                depth_new:
                  type: number
                  format: float
                  description: Original tread depth (mm)
                  example: 50.0
                rtd:
                  type: number
                  format: float
                  description: Current remaining tread depth (mm)
                  example: 25.0
                cost:
                  type: number
                  format: float
                  description: Purchase cost
                purchase_date:
                  type: string
                  format: date
                supplier:
                  type: string
      responses:
        "201":
          description: Tyre created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Tyre"
        "400":
          $ref: "#/components/responses/ValidationError"

  /tyres/{id}:
    get:
      tags: [Tyres]
      summary: Get tyre by ID
      description: Returns tyre details including mount history
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tyre details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Tyre"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Tyres]
      summary: Update tyre
      description: Update tyre information or current RTD measurement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barcode:
                  type: string
                rtd:
                  type: number
                  format: float
                status:
                  type: string
                  enum: [spare, mounted, scrap]
                remarks:
                  type: string
      responses:
        "200":
          description: Tyre updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Tyres]
      summary: Delete tyre
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tyre deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Replacements ───────────────────────────────────────────────────
  /replacements:
    get:
      tags: [Replacements]
      summary: List replacements
      description: Get a paginated list of tyre replacement records (mounts, dismounts, swaps)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: company_id
          in: query
          schema:
            type: integer
        - name: project_id
          in: query
          schema:
            type: integer
        - name: unit_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          description: Start date filter (YYYY-MM-DD)
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          description: End date filter (YYYY-MM-DD)
      responses:
        "200":
          description: List of replacements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Replacement"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

    post:
      tags: [Replacements]
      summary: Create replacement
      description: |
        Record a tyre replacement (mount, dismount, or swap).

        **Mount**: Changes tyre status from "spare" to "mounted" and sets unit_id/position.
        **Dismount**: Changes tyre status from "mounted" to "spare" or "scrap" (based on RTD).
        **Swap**: Combines dismount of old tyre and mount of new tyre in one operation.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_id, driver_id, date, current_life_hm, hm_plan, details]
              properties:
                unit_id:
                  type: integer
                  description: Target unit ID
                driver_id:
                  type: integer
                  description: Operator/driver performing the replacement
                date:
                  type: string
                  format: date
                  description: Date of replacement (YYYY-MM-DD)
                hm_update:
                  type: number
                  format: float
                  description: Hour meter reading at time of replacement
                current_life_hm:
                  type: number
                  format: float
                  description: Current life hour meter
                hm_plan:
                  type: number
                  format: float
                  description: Planned replacement hour meter
                remarks:
                  type: string
                details:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/ReplacementDetail"
      responses:
        "201":
          description: Replacement created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Replacement recorded successfully
                  data:
                    $ref: "#/components/schemas/Replacement"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Conflict — tyre status does not allow the requested action
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: New tyre must be in spare status for mount action

  /replacements/{id}:
    get:
      tags: [Replacements]
      summary: Get replacement by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Replacement details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Replacement"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Replacements]
      summary: Update replacement
      description: Update replacement metadata (remarks, HM values). Tyre status changes cannot be reverted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_id:
                  type: integer
                date:
                  type: string
                  format: date
                hm_update:
                  type: number
                  format: float
                current_life_hm:
                  type: number
                  format: float
                hm_plan:
                  type: number
                  format: float
                remarks:
                  type: string
      responses:
        "200":
          description: Replacement updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Replacements]
      summary: Delete replacement
      description: Soft-delete a replacement record. Tyre status changes are NOT reverted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Replacement deleted
        "404":
          $ref: "#/components/responses/NotFound"

